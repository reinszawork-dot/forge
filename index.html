<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Forge — Train & Eat</title>
  <meta name="description" content="Forge: workout logger, smart progression and calorie tracking in one fast offline app." />
  <meta name="theme-color" content="#0b0d10" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Forge" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30"><path d="M6 13h4v6H6zM22 13h4v6h-4zM10 10h3v12h-3zM19 10h3v12h-3zM13 15h6v2h-6z" fill="currentColor"/></svg>
        </span>
        <div>
          <h1>Forge</h1>
          <p class="sub" id="todayLabel"></p>
        </div>
      </div>
      <button class="icon-btn" id="profileBtn" aria-label="Profile & settings" title="Profile & settings">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- Active-workout floating bar + rest timer -->
  <div class="float-stack">
    <button class="rest-pill" id="restPill" hidden>
      <svg viewBox="0 0 36 36" class="rest-ring"><circle cx="18" cy="18" r="15" class="track"/><circle cx="18" cy="18" r="15" class="prog" id="restProg"/></svg>
      <span id="restText">1:30</span>
      <span class="rest-actions"><span data-rest="-15">−15</span><span data-rest="15">+15</span><span data-rest="skip">Skip</span></span>
    </button>
    <button class="active-bar" id="activeBar" hidden>
      <span class="pulse-dot"></span><span id="activeName">Workout</span><span class="active-time" id="activeTime">0:00</span>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <span class="tab-indicator" id="tabIndicator"></span>
    <button data-tab="today" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Today</span></button>
    <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M2 10h3v4H2zM19 10h3v4h-3zM5 7h3v10H5zM16 7h3v10h-3zM8 11h8v2H8z"/></svg><span>Train</span></button>
    <button data-tab="eat"><svg viewBox="0 0 24 24"><path d="M7 2v9a3 3 0 0 0 2 2.8V22h2v-8.2A3 3 0 0 0 13 11V2h-1.5v7h-1V2h-1.5v7h-1V2zM17 2c-1.7 0-3 2.2-3 5.5 0 2.3 1 3.8 2 4.3V22h2V2z"/></svg><span>Eat</span></button>
    <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18v2H3zM5 12h3v7H5zM10.5 7h3v12h-3zM16 3h3v16h-3z"/></svg><span>Progress</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
